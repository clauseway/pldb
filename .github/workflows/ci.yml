# Tests every branch and pull request. Master is tested by the release
# workflow, which deploys only after the suite passes.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - name: Test
        run: mvn -B -ntp test
