# Releases this repo at the POM's version (minus -SNAPSHOT) on a merge to
# master, once: the version ships when no vX.Y.Z tag exists for it. Deploy
# stages a signed bundle in the Central Portal — the Publish button stays
# manual (autoPublish=false in the POM) — then the tag is pushed. The POM on
# master is never written here: a release is the version bump in the pull
# request that makes it. The button runs the same job; with dry_run it signs
# and bundles without uploading or tagging, tagged version or not.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the bundle; upload and tag nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Maven 3.9.11 — the runner's 3.10 writes resolver bookkeeping into the publishing plugin's staging directory and the Portal rejects the bundle
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: The release version is the POM's without -SNAPSHOT, unless it is tagged already
        id: version
        run: |
          snapshot=$(mvn -q -ntp org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate -Dexpression=project.version -DforceStdout)
          version=${snapshot%-SNAPSHOT}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "$version is already released (tag v$version exists); nothing to deploy"
            echo "release=${{ inputs.dry_run && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set the release version
        if: steps.version.outputs.release == 'true'
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
      - name: Deploy (stages a bundle; nothing publishes without the Portal button)
        if: steps.version.outputs.release == 'true'
        run: mvn -B -ntp clean deploy -P release ${{ inputs.dry_run && '-DskipPublishing=true' || '' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Tag the release
        if: steps.version.outputs.release == 'true' && !inputs.dry_run
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
